KeyWords: MedDRA, MedDRA at a Glance
Script:
  Desc   : >
    R migration of the MedDRA at a Glance Analysis Panel. Shows adverse
    events according to their place in the MedDRA hierarchy (SOC, HLGT,
    HLT, PT) and compares any two arms using risk differences, relative
    risks, odds ratios, Fisher's exact tests, and signal-of-interest flags.
  Name   : ae_meddra_w_flag_generation_v1.R
  GCR    : r135
  SRV    : 12345
  Source : PhUSE WG5 SAS-to-R Migration
  Target : https://github.com/phuse-org/phuse-scripts/blob/master/tested/SAS/SpecDocs/Analysis%20Panel%20Instructions.doc
  Title  : MedDRA at a Glance Analysis Panel (R Migration)
  Topic  : MedDRA
  Type   : analysis
  Subtype: TFL
Package:
  name : R Analysis Panels
  title: PhUSE WG5 R migration package
Language:
  name   : R
  version: ">= 4.3.0"
Comments: >
  R migration of the PhUSE WG5 MedDRA at a Glance Analysis Panel,
  originally implemented in SAS (ae_meddra_w_flag_generation_v1.sas).
  Migrated to idiomatic R using tidyverse and pharmaverse packages.

  Shows adverse events by MedDRA hierarchy: system organ class (SOC),
  high-level group term (HLGT), high-level term (HLT), and preferred
  term (PT). Allows comparison of two treatment arms with configurable
  thresholds for risk difference, relative risk, and negative log p-value
  signals of interest.

  Dataset Requirements:
     Demographics          (DM)  - loaded via haven::read_xpt()
     Adverse Event         (AE)  - loaded via haven::read_xpt()
     Exposure              (EX)  - loaded via haven::read_xpt()
     MedDRA hierarchy file
     Designated Medical Events file

  Variable Requirements:
     DM  - ACTARM, ARM, USUBJID, ARMCD, RFSTDTC, RFENDTC
     AE  - USUBJID, AEBODSYS, AEDECOD, AETOXGR, AESTDTC
     EX  - USUBJID, EXSTDTC, EXENDTC

  Key R Packages:
     haven    - SAS transport (XPT) data I/O
     dplyr    - Data manipulation replacing SAS DATA steps and PROC SQL
     tidyr    - Data reshaping and pivoting
     stringr  - String manipulation replacing SAS character functions
     openxlsx - Excel workbook output replacing SAS SpreadsheetML
     janitor  - SAS-compatible round-half-up rounding behavior
     cli      - User-facing diagnostic messages
Inputs:
  datasets: DM, AE, EX, MedDRA hierarchy, Designated Medical Events
  P1: ae/dm/ex - data frames or file paths to XPT files
  P2: outpath - output directory for generated Excel workbooks
  P3: study_lag - days after last exposure for AE window
  P4: cc - continuity correction value (default 0.5)
  P5: meddra_path - path to MedDRA hierarchy file
  P6: dme_path - path to Designated Medical Events file
Outputs:
  datasets: Excel workbooks via openxlsx
  O1: MedDRA at a Glance workbook with hierarchy sheets (.xlsx)
