Language:
  name   : R
  version: ">= 4.3.0"
Comments: >
  The MedDRA at a Glance Analysis Panel shows the user the adverse events
  that occurred in the study according to their place in the MedDRA
  hierarchy, using the system organ class (SOC), high-level group term
  (HLGT), high-level term (HLT), and preferred term (PT). The user can
  choose which two arms to compare and set thresholds which determine
  whether the risk difference, relative risk, or negative log p-value
  for difference in proportion between the two arms is a signal of interest.
  The user can also sort and filter by any of the information contained in
  the report.

  This R implementation replaces the original SAS macro-based architecture
  with parameterized R functions. SAS macros (%params, %meddra, %meddra_cmp,
  %ab, %cd) are replaced by composable R functions using dplyr pipelines,
  Tplyr count layers, and fisher.test() for statistical comparisons.

  R Packages Used:
     haven        - SAS XPT dataset I/O (read_xpt, read_sas)
     dplyr        - Data manipulation replacing SAS DATA steps and PROC SQL
     tidyr        - Data reshaping (pivot_wider, pivot_longer)
     purrr        - Functional programming replacing SAS macro loops
     stringr      - String manipulation replacing SAS character functions
     forcats      - Factor level management replacing SAS format ordering
     Tplyr        - Clinical summary tables replacing PROC FREQ/MEANS
     openxlsx     - Excel workbook output replacing SpreadsheetML XML
     janitor      - SAS-compatible round_half_up() rounding
     cli          - User-facing messages and error formatting

  Dataset Requirements:
     Demographics          (DM)
     Adverse Event         (AE)
     Exposure              (EX)
     MedDRA hierarchy - need to specify what version of MedDRA
     Designated Medical Events

  Variable Requirements (passed as R function arguments or read from data frames):
     DM  - Actual Arm                          (ACTARM)
         - Planned Treatment Arm               (ARM)
         - Subject ID                          (USUBJID)
         - Planned Arm Code                    (ARMCD)
         - Subject Reference Start Date/Time   (RFSTDTC)
         - Subject Reference End Date/Time     (RFENDTC)
     AE  - Subject ID                          (USUBJID)
         - Body system/organ class             (AEBODSYS)
         - Dictionary Derived Term             (AEDECOD)
         - Toxicity Grade                      (AETOXGR)
         - Adverse Event Start Date/Time       (AESTDTC)
     EX  - Subject ID                          (USUBJID)
         - Exposure Start Date/Time            (EXSTDTC)
         - Exposure End Date/Time              (EXENDTC)
     MedDRA Hierarchy for correct version
     Designated Medical Events

  R Function Architecture:
     All SAS macro parameters become named R function arguments with matching
     defaults. SAS %include statements are replaced by source() calls to
     modular R function files. Global macro variables are replaced by a
     configuration list object passed as a function argument.
