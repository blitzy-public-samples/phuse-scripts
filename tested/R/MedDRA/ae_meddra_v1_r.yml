Inputs:
  datasets: dat1, dat2, dat3
  P1: Data frame or file path - Demographics dataset (DM domain)
  P2: String - MedDRA version identifier for hierarchy lookup
  P3: Number - Study lag window in days for exposure-based subject filtering
  P4: String - Continuity correction method (numeric threshold or arm-based)
Outputs:
  datasets: out1, out2
  O1: MedDRA at a Glance Analysis Panel workbook (.xlsx via openxlsx)
  O2: Error Summary workbook (.xlsx via openxlsx)
