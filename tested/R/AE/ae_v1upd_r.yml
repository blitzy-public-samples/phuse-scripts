KeyWords: AE, Severity, Toxicity, Oncology
Script:
  Desc   : >
    R migration of the AE (Adverse Events) Analysis Panels, covering both
    the AE Severity Panel (ae_v1.R, ae_v1upd.R) and the AE Toxicity/Oncology
    Panel (ae_oncology_v1.R, ae_oncology_v1upd.R). Provides subject-level and
    event-level adverse event analyses by treatment arm with statistical and
    frequency reports generated as Excel workbooks via openxlsx.
  Name   : ae_v1upd.R, ae_oncology_v1upd.R
  GCR    : r135
  SRV    : 12345
  Source : PhUSE WG5 SAS-to-R Migration
  Target : https://github.com/phuse-org/phuse-scripts/blob/master/tested/SAS/SpecDocs/Analysis%20Panel%20Instructions.doc
  Title  : AE Severity & Toxicity Analysis Panel (R Migration)
  Topic  : Severity, Toxicity
  Type   : analysis
  Subtype: TFL
Package:
  name : R Analysis Panels
  title: PhUSE WG5 R migration package
Language:
  name   : R
  version: ">= 4.3.0"
Comments: >
  R migration of the PhUSE WG5 Adverse Events Analysis Panels, originally
  implemented in SAS (ae_v1upd.sas, ae_oncology_v1upd.sas). This manifest
  covers two complementary analysis panels migrated to idiomatic R using
  tidyverse and pharmaverse packages.

  AE Severity Panel (ae_v1.R, ae_v1upd.R):
  Generates three separate Excel workbooks.
  1. Adverse Events Counts: provides various combinations of counts and
     percentages of most frequent adverse events and serious adverse events
     by treatment arm (Analyses A, B, C, D).
  2. Adverse Events Relative Risk: provides a listing of the relative risk of
     adverse events between arms with their corresponding confidence intervals.
  3. Adverse Events Odds Ratio: provides a listing of odds ratios of adverse
     events between arms with their corresponding confidence intervals.

  AE Toxicity Panel (ae_oncology_v1.R, ae_oncology_v1upd.R):
  Generates one Excel workbook with the following analyses.
  Analysis 1: Toxicity Grade Summary showing subject counts and proportions
  by toxicity grade (1-5) per treatment arm.
  Analysis 2 and 3: Preferred Term Analysis by Toxicity Grade listing all
  adverse events with subject counts and proportions per arm.
  Analysis 4 and 5: Two-Term MedDRA Analysis providing risk differences,
  relative risks, odds ratios, confidence intervals, and p-values for
  adverse events between treatment and control arms.

  Dataset Requirements:
     Demographics          (DM)  - loaded via haven::read_xpt()
     Adverse Event         (AE)  - loaded via haven::read_xpt()
     Exposure              (EX)  - loaded via haven::read_xpt()

  Variable Requirements:
     DM  - Actual Arm (ACTARM), Planned Treatment Arm (ARM),
           Subject ID (USUBJID), Planned Arm Code (ARMCD),
           Subject Reference Start Date/Time (RFSTDTC),
           Subject Reference End Date/Time (RFENDTC)
     AE  - Subject ID (USUBJID), Body System/Organ Class (AEBODSYS),
           Dictionary Derived Term (AEDECOD), Severity/Intensity (AESEV),
           Serious Event (AESER), AE Start Date/Time (AESTDTC)
     EX  - Subject ID (USUBJID), Exposure Start Date/Time (EXSTDTC),
           Exposure End Date/Time (EXENDTC)

  Key R Packages:
     haven    - SAS transport (XPT) data I/O
     dplyr    - Data manipulation replacing SAS DATA steps and PROC SQL
     tidyr    - Data reshaping and pivoting
     stringr  - String manipulation replacing SAS character functions
     openxlsx - Excel workbook output replacing SAS SpreadsheetML
     janitor  - SAS-compatible round-half-up rounding behavior
     cli      - User-facing diagnostic messages
Inputs:
  datasets: DM, AE, EX
  P1: ae/dm/ex - data frames or file paths to XPT files (loaded via haven::read_xpt)
  P2: outpath - output directory for generated Excel workbooks (parameterized, no hardcoded paths)
  P3: study_lag - days after last exposure for AE window (default 120 for severity, 30 for oncology)
  P4: cc - continuity correction value (default 0 for severity, 0.5 for oncology)
Outputs:
  datasets: Excel workbooks via openxlsx
  O1: AE Severity workbooks - AE Counts, Odds Ratio, Relative Risk (.xlsx)
  O2: AE Toxicity workbook - Toxicity Grade Summary, PT by Grade, MedDRA Comparison (.xlsx)
