KeyWords: AE, Toxicity, Oncology
Script:
  Desc   : >
    R migration of the AE Toxicity (Oncology) Analysis Panel. Provides
    toxicity grade summaries, preferred term analysis by toxicity grade,
    and two-term MedDRA analysis with risk differences, relative risks,
    odds ratios, confidence intervals, and p-values for adverse events
    between treatment and control arms.
  Name   : ae_oncology_v1upd.R
  GCR    : r135
  SRV    : 12345
  Source : PhUSE WG5 SAS-to-R Migration
  Target : https://github.com/phuse-org/phuse-scripts/blob/master/tested/SAS/SpecDocs/Analysis%20Panel%20Instructions.doc
  Title  : AE Toxicity Analysis Panel (R Migration)
  Topic  : Toxicity
  Type   : analysis
  Subtype: TFL
Package:
  name : R Analysis Panels
  title: PhUSE WG5 R migration package
Language:
  name   : R
  version: ">= 4.3.0"
Comments: >
  R migration of the PhUSE WG5 AE Toxicity (Oncology) Analysis Panel,
  originally implemented in SAS (ae_oncology_v1upd.sas). Migrated to
  idiomatic R using tidyverse and pharmaverse packages.

  Analysis 1: Toxicity Grade Summary
  Shows how many and what proportion of each arm's subjects experienced
  any adverse event, for all toxicity grades and for grades 3, 4, and 5.

  Analysis 2 & 3: Preferred Term Analysis by Toxicity Grade
  Lists all adverse events with subject counts and proportions per arm
  for all toxicity grades and for grades 3, 4, and 5.

  Analysis 4 & 5: Two-Term MedDRA Analysis
  Lists adverse events by two user-selected MedDRA levels with risk
  differences, relative risks, odds ratios, 95% CIs, and p-values.

  Dataset Requirements:
     Demographics          (DM)  - loaded via haven::read_xpt()
     Adverse Event         (AE)  - loaded via haven::read_xpt()
     Exposure              (EX)  - loaded via haven::read_xpt()

  Key R Packages:
     haven    - SAS transport (XPT) data I/O
     dplyr    - Data manipulation replacing SAS DATA steps and PROC SQL
     tidyr    - Data reshaping and pivoting
     stringr  - String manipulation replacing SAS character functions
     openxlsx - Excel workbook output replacing SAS SpreadsheetML
     janitor  - SAS-compatible round-half-up rounding behavior
     cli      - User-facing diagnostic messages
Inputs:
  datasets: DM, AE, EX
  P1: ae/dm/ex - data frames or file paths to XPT files
  P2: outpath - output directory for generated Excel workbooks
  P3: study_lag - days after last exposure for AE window (default 30)
  P4: cc - continuity correction value (default 0.5)
Outputs:
  datasets: Excel workbooks via openxlsx
  O1: AE Toxicity workbook - Toxicity Grade Summary (.xlsx)
  O2: PT by Grade, MedDRA Comparison sheets
