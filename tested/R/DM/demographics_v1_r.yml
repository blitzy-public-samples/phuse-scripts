R_Dependencies:
  - package: haven
    version: ">= 2.5.5"
    purpose: "SAS/XPT data I/O"
  - package: dplyr
    version: ">= 1.1.0"
    purpose: "Data manipulation (replaces DATA steps, PROC SQL)"
  - package: tidyr
    version: ">= 1.3.0"
    purpose: "Data reshaping (replaces PROC TRANSPOSE)"
  - package: Tplyr
    version: ">= 1.2.1"
    purpose: "Clinical summary tables (replaces PROC FREQ, PROC MEANS)"
  - package: r2rtf
    version: ">= 1.1.1"
    purpose: "RTF output generation"
  - package: openxlsx
    version: ">= 4.2.5"
    purpose: "Excel output (replaces JET/PCFILES engine)"
  - package: forcats
    version: ">= 1.0.0"
    purpose: "Factor level management (replaces SAS format ordering)"
  - package: janitor
    version: ">= 2.2.0"
    purpose: "round_half_up for SAS-compatible rounding"
  - package: cli
    version: ">= 3.6.0"
    purpose: "User-facing messages and errors"
  - package: stringr
    version: ">= 1.5.0"
    purpose: "String manipulation (replaces SAS character functions)"
