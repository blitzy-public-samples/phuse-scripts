Migration:
  source: tested/SAS/DS/disposition_v2.sas
  target: tested/R/DS/disposition_v2.R
  type: SAS-to-R
  parity: functional
  date: 03/24/2026
  notes: >
    Full functional parity migration of SAS disposition analysis panel.
    Seven SAS macros (%params, %ds_prelim_check, %ds_setup, %ds_by_arm,
    %time_to_event, %ds_out, %ds) migrated to seven parameterized R
    functions. All date arithmetic preserves SAS +1 rule for same-day
    and post-reference dates. Rounding uses janitor::round_half_up()
    for SAS-compatible behavior. Missing values map to NA (not zero)
    except for deliberate display zero-fill matching SAS PROC STDIZE.
