    version: ">= 1.1.0"
    purpose: Core data manipulation replacing SAS DATA steps and PROC SQL
  - name: tidyr
    version: ">= 1.3.0"
    purpose: Reshaping and missing value handling replacing SAS PROC TRANSPOSE
  - name: survival
    version: ">= 3.5-0"
