R_Dependencies:
  packages:
    - name: haven
      version: ">= 2.5.5"
      purpose: Data I/O for SAS transport (XPT) files
    - name: dplyr
      version: ">= 1.1.0"
      purpose: Core data manipulation replacing SAS DATA steps
    - name: tidyr
      version: ">= 1.3.0"
      purpose: Data reshaping and pivoting
    - name: readr
      version: ">= 2.1.0"
      purpose: CSV file reading for lookup reference data
    - name: survival
      version: ">= 3.5-0"
      purpose: Retention analysis (Analysis 1) replacing PROC LIFETEST
    - name: ggplot2
      version: ">= 3.4.0"
      purpose: Visualization for retention curves, dose distribution, and boxplots
    - name: Tplyr
      version: ">= 1.2.1"
      purpose: Descriptive statistics tables (Analysis 3)
    - name: r2rtf
      version: ">= 1.1.1"
      purpose: RTF output generation replacing SAS ODS RTF
    - name: openxlsx
      version: ">= 4.2.5"
      purpose: Excel workbook output replacing SAS PCFILES/SpreadsheetML
    - name: janitor
      version: ">= 2.2.0"
      purpose: SAS-compatible rounding via round_half_up
    - name: cli
      version: ">= 3.6.0"
      purpose: User-facing messages and error formatting
    - name: lubridate
      version: ">= 1.9.0"
      purpose: Date arithmetic replacing SAS date functions
  R_scripts:
    - tested/R/macros/data_checks_exposure.R
    - tested/R/utilities/data_checks.R
    - tested/R/utilities/err_output.R
    - tested/R/utilities/sl_gs_output.R
    - tested/R/utilities/xml_output.R
Migration:
  source_file: tested/SAS/EX/exposure_v1.sas
  source_manifest: tested/SAS/EX/exposure_v1_sas.yml
  framework: tidyverse + pharmaverse
  date: 03/24/2026
  notes: >
    Migrated from SAS to R as part of PhUSE WG5 phuse-scripts repository
    SAS-to-R migration initiative. All 5 exposure analyses are preserved
    with functional parity. SAS DATA steps replaced with dplyr pipelines,
    PROC LIFETEST replaced with survival::survfit for retention curves,
    SAS PCFILES/SpreadsheetML replaced with openxlsx for Excel output,
    and SAS ODS replaced with r2rtf for RTF output.
